<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>RM365 Toolbox</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/assets/RM365_Favicon.png">

  <!-- Development backend URL override -->
  <!-- Backend URL will be automatically detected from config.js -->

  <!-- Early theme: saved or system -->
  <script>
    const html = document.documentElement;
    const stored = localStorage.getItem('darkMode');
    const prefersDark = window.matchMedia?.('(prefers-color-scheme: dark)').matches;
    const isDark = stored === 'true' || (stored == null && prefersDark);
    if (isDark) {
      html.classList.add('dark-mode');
    }
  </script>

  <!-- Fonts + libs -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <!-- Charts (Attendance overview) - Load early to ensure availability -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
  <script>
    // Verify Chart.js loads properly
    window.addEventListener('load', () => {
      console.log('🎨 Chart.js loaded status:', typeof Chart !== 'undefined');
      if (typeof Chart !== 'undefined') {
        console.log('✅ Chart.js version:', Chart.version || 'unknown');
        console.log('✅ Chart.js defaults available:', !!Chart.defaults);
      }
    });
  </script>

  <!-- ===== NEW CSS Architecture - Single Source of Truth ===== -->
  <link rel="stylesheet" href="/css/app.css">
  
  <!-- Page-specific CSS (loaded dynamically or keep commonly used ones) -->
  <link rel="stylesheet" href="/css/pages/login.css">
  
  <!-- Attendance System (consolidated module) -->
  <link rel="stylesheet" href="/css/pages/attendance-system/employees.css">
  <link rel="stylesheet" href="/css/pages/attendance-system/dashboard.css">
  <link rel="stylesheet" href="/css/pages/attendance-system/automatic.css">
  <link rel="stylesheet" href="/css/pages/attendance-system/logs.css">
  
  <link rel="stylesheet" href="/css/pages/labels/generator.css">
  <link rel="stylesheet" href="/css/pages/labels/history.css">
  <link rel="stylesheet" href="/css/pages/magentodata/universal.css">
  <link rel="stylesheet" href="/css/pages/magentodata/filters-modal.css">
  <link rel="stylesheet" href="/css/pages/magentodata/history.css">
  <link rel="stylesheet" href="/css/pages/inventory/management.css">
  <link rel="stylesheet" href="/css/pages/inventory/sourcing.css">
  <link rel="stylesheet" href="/css/pages/orders/fulfillment.css">
  <link rel="stylesheet" href="/css/pages/orders/progress.css">
  <link rel="stylesheet" href="/css/pages/orders/tracking.css">
  <link rel="stylesheet" href="/css/pages/orders/tracking-card-v2.css">
  <link rel="stylesheet" href="/css/pages/orders/approval.css">
  <link rel="stylesheet" href="/css/pages/orders/scanner.css">
  <link rel="stylesheet" href="/css/pages/orders/scanning-logs.css">
  <link rel="stylesheet" href="/css/pages/orders/fulfillment-design.css">
  <link rel="stylesheet" href="/css/pages/usermanagement/users.css">
  
  <!-- Liquid Glass Toggle -->
  <link rel="stylesheet" href="/css/liquid-glass/toggle.css">

  <link rel="manifest" href="/manifest.webmanifest">

  <style>
    /* Loading overlay visibility - all styles in loaders.css */
    /* Hidden state - controlled via hidden attribute AND inline styles from JS */
    #loadingOverlay[hidden] {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
    }
    
    /* Toast container must always be visible and on top */
    #toast-container {
      position: fixed !important;
      z-index: 2147483647 !important;
      opacity: 1 !important;
      visibility: visible !important;
    }
    
    /* Hide main content initially until loaded, but keep loading overlay and toasts visible */
    body > *:not(#loadingOverlay):not(#toast-container) {
      opacity: 0;
      transition: opacity 0.3s ease-in-out;
    }
    
    body.loaded > *:not(#loadingOverlay):not(#toast-container) {
      opacity: 1;
    }
  </style>
</head>

<body>
  <noscript>You need JavaScript enabled to use this app.</noscript>

  <!-- Loading overlay (visible by default, no hidden attribute) -->
  <div id="loadingOverlay" class="fullscreen-overlay">
    <div id="particles-background" class="vertical-centered-box particles-background"></div>
    <div id="particles-foreground" class="vertical-centered-box particles-foreground"></div>
    <div class="vertical-centered-box">
      <div class="loader-content">
        <div class="loader-circle"></div>
        <div class="loader-line-mask">
          <div class="loader-line"></div>
        </div>
        <img src="/assets/RM365_Logo_New.png" alt="RM365" class="loader-logo-img">
        <div id="loadingMessage" class="loading-message">Loading...</div>
      </div>
    </div>
  </div>

  <!-- Header -->
  <header class="header">
    <h1 id="pageTitle">RM365</h1>
  </header>

  <!-- Main view container. Router swaps content here -->
  <main id="content">
    <div id="view"><!-- HTML partials load here --></div>
  </main>

  <!-- Global config available to modules -->
  <script>
    // Backend URL configuration - supports environment variables or defaults
    // Note: The actual API URL is determined by config.js module
    window.API = window.API || 
                        (typeof process !== 'undefined' && process.env?.API) ||
                        undefined; // Don't log false, let config.js handle it
    
    window.IS_TAURI = !!(window.__TAURI__ && (window.__TAURI__.invoke || (window.__TAURI__.fs && (window.__TAURI__.fs.readTextFile || window.__TAURI__.fs.exists))));
    
    // Debug logging for configuration (actual API URL logged by config.js)
    if (window.API) {
      console.log('[Config] Backend URL (from window.API):', window.API);
    }
    console.log('[Config] Frontend Origin:', window.location.origin);
    
    // Mark body as loaded once DOM is ready
    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => document.body.classList.add('loaded'), 100);
    });
  </script>

  <!-- Particleground for loading screen -->
  <script src="/js/utils/particleground.js"></script>
  <script>
    // Initialize particle backgrounds for the loading screen
    (function() {
      function getParticleColors() {
        const isDark = document.documentElement.classList.contains('dark-mode');
        if (isDark) {
          // Dark mode: use light colors for contrast
          return {
            fg: { dot: 'rgba(255, 255, 255, 0.8)', line: 'rgba(255, 255, 255, 0.05)' },
            bg: { dot: 'rgba(255, 255, 255, 0.4)', line: 'rgba(255, 255, 255, 0.03)' }
          };
        } else {
          // Light mode: use muted dark colors
          return {
            fg: { dot: 'rgba(72, 72, 72, 0.4)', line: 'rgba(72, 72, 72, 0.05)' },
            bg: { dot: 'rgba(72, 72, 72, 0.2)', line: 'rgba(72, 72, 72, 0.03)' }
          };
        }
      }

      var pgForeground, pgBackground;

      function initParticles() {
        var colors = getParticleColors();
        var fgEl = document.getElementById('particles-foreground');
        var bgEl = document.getElementById('particles-background');
        
        if (fgEl && typeof particleground !== 'undefined') {
          pgForeground = particleground(fgEl, {
            dotColor: colors.fg.dot,
            lineColor: colors.fg.line,
            minSpeedX: 0.3,
            maxSpeedX: 0.6,
            minSpeedY: 0.3,
            maxSpeedY: 0.6,
            density: 25000,
            proximity: 150,
            parallaxMultiplier: 10,
            particleRadius: 3,
            lineWidth: 1
          });
        }
        
        if (bgEl && typeof particleground !== 'undefined') {
          pgBackground = particleground(bgEl, {
            dotColor: colors.bg.dot,
            lineColor: colors.bg.line,
            minSpeedX: 0.075,
            maxSpeedX: 0.15,
            minSpeedY: 0.075,
            maxSpeedY: 0.15,
            density: 30000,
            proximity: 20,
            parallaxMultiplier: 20,
            particleRadius: 2,
            lineWidth: 1
          });
        }
      }

      // Initialize when DOM is ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initParticles);
      } else {
        initParticles();
      }

      // Store references for cleanup
      window.__loadingParticles = { fg: pgForeground, bg: pgBackground };
    })();
  </script>

  <!-- Optional: UI helpers (if you still need them globally) -->
  <script src="/js/ui/components.js" defer></script>
  
  <!-- Filter Control Panel Component -->
  <script src="/js/ui/filterControlPanel.js" defer></script>
  
  <!-- Table Sorting Utility (Global) -->
  <script src="/js/utils/tableSorting.js" defer></script>
  
  <!-- Table Focus Mode (Press F for fullscreen table view) -->
  <script src="/js/utils/tableFocusMode.js" defer></script>

  <!-- Debug utilities for development -->
  <script type="module" src="/js/debug.js"></script>

  <!-- App router + entrypoint -->
  <script type="module" src="/js/index.js"></script>
  
  <!-- Universal Footer -->
  <div id="universalFooter"></div>
  <script>
    fetch('/components/universal-footer.html')
      .then(response => response.text())
      .then(html => {
        document.getElementById('universalFooter').innerHTML = html;
      })
      .catch(error => console.error('Error loading footer:', error));
  </script>
</body>

</html>
