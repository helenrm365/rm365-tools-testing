<!-- Labels History Page -->
<!-- Uses css/app.css + css/pages/labels/history.css -->
<div class="labels-history">
  <!-- Header -->
  <header class="page-header">
    <div class="header-content">
      <h1 class="page-title">Label History</h1>
    </div>
    <p class="page-subtitle">View and manage your label generation history</p>
  </header>

  <!-- Navigation Tabs -->
  <nav class="inner-tabs">
    <button class="tab-button" onclick="location.href='/labels/generator'">
      <i class="fas fa-barcode"></i>
      <span>Generator</span>
    </button>
    <button class="tab-button active" onclick="location.href='/labels/history'">
      <i class="fas fa-history"></i>
      <span>History</span>
    </button>
  </nav>

  <!-- Main Content -->
  <div class="history-wrapper">
    <!-- Print Jobs Controls Card -->
    <div class="action-block">
      <div class="block-header">
        <div class="block-icon">
          <i class="fas fa-print"></i>
        </div>
        <div class="block-title-group">
          <h3 class="block-title">Print Jobs</h3>
          <p class="block-subtitle" id="jobCountSubtitle">Loading...</p>
        </div>
        <div class="header-actions">
          <div class="form-group" style="margin: 0;">
            <select id="limitSelect" data-enhance="c-select">
              <option value="10" selected>Last 10</option>
              <option value="25">Last 25</option>
              <option value="50">Last 50</option>
              <option value="100">Last 100</option>
            </select>
          </div>
          <button id="refreshHistoryBtn" class="action-btn secondary-btn neutral-btn">
            <i class="fas fa-sync-alt"></i>
            <span>Refresh</span>
          </button>
        </div>
      </div>

      <div class="block-content">
        <!-- Bulk Actions Row -->
        <div id="bulkActionsRow" class="bulk-actions-row">
          <div class="bulk-left">
            <label class="card-checkbox">
              <input type="checkbox" id="selectAllCheckbox">
              <span class="checkbox-custom"></span>
              <span class="checkbox-label-text">Select All</span>
            </label>
            <span class="selection-count" id="selectionCount"></span>
          </div>
          <div class="bulk-right">
            <button id="deleteSelectedBtn" class="action-btn primary-btn danger-btn" disabled>
              <i class="fas fa-trash"></i>
              <span>Delete Selected (<span id="selectedCountBtn">0</span>)</span>
            </button>
            <button id="deleteAllBtn" class="action-btn primary-btn danger-btn">
              <i class="fas fa-trash-alt"></i>
              <span>Delete All</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Jobs Table -->
    <div id="historyTable" class="table-container">
      <div class="loading-state">
        <div class="loading-spinner"></div>
        <p>Loading history...</p>
      </div>
    </div>

    <!-- History Details Panel -->
    <div id="historyDetails" class="action-block details-panel" style="display: none;">
      <div class="block-header">
        <div class="block-icon">
          <i class="fas fa-info-circle"></i>
        </div>
        <div class="block-title-group">
          <h3 class="block-title" id="detailsTitle">Job Details</h3>
          <p class="block-subtitle" id="detailsSubtitle">View items in this job</p>
        </div>
        <button id="closeDetailsBtn" class="action-btn secondary-btn neutral-btn">
          <i class="fas fa-times"></i>
          <span>Close</span>
        </button>
      </div>

      <div class="block-content">
        <div id="runDetailsContent" class="table-container details-table">
          <!-- Populated by JS -->
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Universal Footer -->
<div id="footerPlaceholder"></div>
<script>
  if (!document.getElementById('universalFooter')) {
    fetch('/components/universal-footer.html')
      .then(response => response.text())
      .then(html => {
        document.getElementById('footerPlaceholder').innerHTML = html;
      })
      .catch(error => console.error('Error loading footer:', error));
  }
</script>
