<!-- Attendance Dashboard Page (Attendance System) -->
<!-- Uses css/app.css + css/pages/attendance-system/dashboard.css -->
<div class="attendance-dashboard">
  <!-- Header -->
  <header class="page-header">
    <div class="header-content">
      <h1 class="page-title">Attendance Dashboard</h1>
    </div>
    <p class="page-subtitle">Real-time insights and comprehensive attendance tracking</p>
  </header>

  <!-- Navigation Tabs -->
  <nav class="inner-tabs">
    <button class="tab-button active" onclick="location.href='/attendance-system/dashboard'">
      <i class="fas fa-chart-line"></i>
      <span>Dashboard</span>
    </button>
    <button class="tab-button" onclick="location.href='/attendance-system/employees'">
      <i class="fas fa-users"></i>
      <span>Employees</span>
    </button>
    <button class="tab-button" onclick="location.href='/attendance-system/automatic'">
      <i class="fas fa-fingerprint"></i>
      <span>Automatic</span>
    </button>
    <button class="tab-button" onclick="location.href='/attendance-system/logs'">
      <i class="fas fa-file-alt"></i>
      <span>Logs</span>
    </button>
  </nav>

  <!-- Main Content -->
  <div class="dashboard-content">
    <!-- Today's Stats -->
    <div class="action-block">
      <div class="block-header">
        <div class="block-icon">
          <i class="fas fa-chart-pie"></i>
        </div>
        <div class="block-title-group">
          <h3 class="block-title">Today's Snapshot</h3>
          <p class="block-subtitle">Real-time attendance statistics</p>
        </div>
      </div>
      <div class="block-content">
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-icon total-icon">
              <i class="fas fa-users"></i>
            </div>
            <div class="stat-info">
              <div class="stat-value" id="totalEmployees">-</div>
              <div class="stat-label">Total Employees</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon checked-in-icon">
              <i class="fas fa-user-check"></i>
            </div>
            <div class="stat-info">
              <div class="stat-value" id="checkedIn">-</div>
              <div class="stat-label">Checked In</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon checked-out-icon">
              <i class="fas fa-user-clock"></i>
            </div>
            <div class="stat-info">
              <div class="stat-value" id="checkedOut">-</div>
              <div class="stat-label">Checked Out</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon absent-icon">
              <i class="fas fa-user-times"></i>
            </div>
            <div class="stat-info">
              <div class="stat-value" id="absentToday">-</div>
              <div class="stat-label">Absent Today</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Filters Section -->
    <div class="action-block">
      <div class="block-header">
        <div class="block-icon">
          <i class="fas fa-filter"></i>
        </div>
        <div class="block-title-group">
          <h3 class="block-title">Filters</h3>
          <p class="block-subtitle">Filter attendance data by date and criteria</p>
        </div>
      </div>
      <div class="block-content">
        <div class="filters-grid">
          <div class="form-group">
            <label class="form-label" for="fromDate">
              <i class="fas fa-calendar-alt"></i>
              <span>From Date</span>
            </label>
            <input type="date" id="fromDate" class="form-input">
          </div>
          <div class="form-group">
            <label class="form-label" for="toDate">
              <i class="fas fa-calendar-alt"></i>
              <span>To Date</span>
            </label>
            <input type="date" id="toDate" class="form-input">
          </div>
          <div class="form-group">
            <label class="form-label" for="locationFilter">
              <i class="fas fa-map-marker-alt"></i>
              <span>Location</span>
            </label>
            <select id="locationFilter" data-enhance="c-select">
              <option value="" selected>All Locations</option>
              <option value="UK">UK</option>
              <option value="FR">France</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="nameFilter">
              <i class="fas fa-search"></i>
              <span>Employee Name</span>
            </label>
            <div class="search-wrapper">
              <i class="fas fa-search search-icon"></i>
              <input type="text" id="nameFilter" class="search-input" placeholder="Search by name...">
            </div>
          </div>
        </div>
        <div class="filter-actions">
          <button id="applyFiltersBtn" class="action-btn primary-btn">
            <i class="fas fa-filter"></i>
            <span>Apply Filters</span>
          </button>
          <button id="clearFiltersBtn" class="action-btn secondary-btn">
            <i class="fas fa-times"></i>
            <span>Clear All</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Work Hours Results (populated by JS) -->
    <div id="workHoursResults" class="action-block" style="display: none;">
      <!-- Work hours content will be populated by JavaScript -->
    </div>
  </div>
</div>

<!-- Universal Footer -->
<div id="footerPlaceholder"></div>
<script>
  if (!document.getElementById('universalFooter')) {
    fetch('/components/universal-footer.html')
      .then(response => response.text())
      .then(html => {
        document.getElementById('footerPlaceholder').innerHTML = html;
      })
      .catch(error => console.error('Error loading footer:', error));
  }
</script>
