<!-- Automatic Clocking Page (Attendance System) -->
<!-- Uses css/app.css + css/pages/attendance-system/automatic.css -->
<div class="attendance-automatic">
  <!-- Header -->
  <header class="page-header">
    <div class="header-content">
      <h1 class="page-title">Automatic Clocking</h1>
    </div>
    <p class="page-subtitle">NFC-based attendance tracking</p>
  </header>

  <!-- Navigation Tabs -->
  <nav class="inner-tabs">
    <button class="tab-button" onclick="location.href='/attendance-system/dashboard'">
      <i class="fas fa-chart-line"></i>
      <span>Dashboard</span>
    </button>
    <button class="tab-button" onclick="location.href='/attendance-system/employees'">
      <i class="fas fa-users"></i>
      <span>Employees</span>
    </button>
    <button class="tab-button active" onclick="location.href='/attendance-system/automatic'">
      <i class="fas fa-fingerprint"></i>
      <span>Automatic</span>
    </button>
    <button class="tab-button" onclick="location.href='/attendance-system/logs'">
      <i class="fas fa-file-alt"></i>
      <span>Logs</span>
    </button>
  </nav>

  <!-- Scan Result Alert (Hidden by default) -->
  <div id="scanResultAlert" class="scan-result-alert" style="display: none;">
    <div class="alert-content">
      <i class="alert-icon fas fa-check-circle"></i>
      <div class="alert-text">
        <h4 class="alert-title">Scan Successful</h4>
        <p class="alert-message" id="scanResultMessage"></p>
      </div>
      <button class="alert-close" onclick="document.getElementById('scanResultAlert').style.display='none'">
        <i class="fas fa-times"></i>
      </button>
    </div>
  </div>

  <!-- Main Content -->
  <div class="automatic-wrapper">

    <!-- Compact Scanner Control Bar -->
    <div class="scanner-control-bar">
      <div class="scanner-control-left">
        <div class="scanner-pulse" id="scannerAnimation">
          <div class="pulse-ring"></div>
          <i class="fas fa-wifi"></i>
        </div>
        <div class="scanner-control-info">
          <div class="scanner-control-status">
            <div id="cardStatus" class="hw-badge status-ready">
              <i class="fas fa-check-circle"></i>
              <span>Ready</span>
            </div>
            <span class="scan-stat">Last: <strong id="lastScanTime">—</strong></span>
            <span class="scan-stat">Scans: <strong id="totalScansToday">0</strong></span>
          </div>
          <div id="scannerStatus" class="scanner-status-line status-ready">Card reader detected</div>
        </div>
      </div>
      <div class="scanner-control-actions">
        <button id="startScanBtn" class="btn primary-btn success-btn">
          <i class="fas fa-play-circle"></i>
          <span>Start Scanning</span>
        </button>
        <button id="stopScanBtn" class="btn primary-btn danger-btn" disabled>
          <i class="fas fa-stop-circle"></i>
          <span>Stop Scanning</span>
        </button>
      </div>
    </div>

    <!-- Recent Scans -->
    <div class="action-block">
      <div class="block-header">
        <div class="block-icon history-icon">
          <i class="fas fa-history"></i>
        </div>
        <div class="block-title-group">
          <h3 class="block-title">Recent Scans</h3>
          <p class="block-subtitle">Latest NFC clocking records</p>
        </div>
      </div>

      <div class="block-content">
        <div id="recentScansTable">
          <div class="empty-state">
            <i class="fas fa-inbox"></i>
            <p>No scans yet — start scanning to see activity here</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
