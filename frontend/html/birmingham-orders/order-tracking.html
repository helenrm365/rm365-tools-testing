<!-- Birmingham Orders - Order Tracking Page -->
<!-- Uses css/app.css + css/pages/orders/tracking.css -->
<div class="order-tracking">
  <!-- Header -->
  <header class="page-header">
    <div class="header-content">
      <h1 class="page-title">Birmingham Orders - Order Tracking</h1>
    </div>
    <p class="page-subtitle">Track orders through picking, checking, and completion stages for UK Birmingham branch</p>
  </header>

  <!-- Navigation Tabs -->
  <nav class="nui-tabs">
    <button class="nui-tab" onclick="location.href='/birmingham-orders/order-fulfillment'">
      <i class="fas fa-shopping-cart"></i>
      <span>Order Fulfillment</span>
    </button>
    <button class="nui-tab" onclick="location.href='/birmingham-orders/order-progress'">
      <i class="fas fa-chart-line"></i>
      <span>Order Progress</span>
    </button>
    <button class="nui-tab is-active" onclick="location.href='/birmingham-orders/order-tracking'">
      <i class="fas fa-tasks"></i>
      <span>Order Tracking</span>
    </button>
    <button class="nui-tab" onclick="location.href='/birmingham-orders/order-approval'">
      <i class="fas fa-check-circle"></i>
      <span>Order Approval</span>
    </button>
    <button class="nui-tab" onclick="location.href='/birmingham-orders/scanner'">
      <i class="fas fa-barcode"></i>
      <span>Scanner</span>
    </button>
    <button class="nui-tab" onclick="location.href='/birmingham-orders/scanning-logs'">
      <i class="fas fa-history"></i>
      <span>Scanning Logs</span>
    </button>
  </nav>

  <!-- Board Controls -->
  <div class="ot-controls">
    <div class="ot-live-status" id="liveStatus">
      <span class="ot-dot"></span>
      <span class="status-text">Connecting</span>
    </div>
    <button class="btn btn-icon ot-refresh-btn" id="refreshBoardBtn">
      <i class="fas fa-sync-alt"></i>
    </button>
    <div class="ot-toggle">
      <input type="checkbox" id="minimalModeToggle">
      <label for="minimalModeToggle">Minimal</label>
    </div>
  </div>

  <!-- 3-Column Board -->
  <div class="ot-board">
    <!-- Ready to Pick Column -->
    <section class="ot-column ot-column-pick">
      <div class="ot-column-header">
        <div class="ot-column-icon"><i class="fas fa-clipboard-list"></i></div>
        <span class="ot-column-title">Ready to Pick</span>
        <span class="ot-column-count" id="readyToPickCount">0</span>
      </div>
      <div class="ot-column-body" id="readyToPickColumn"></div>
    </section>

    <!-- Ready to Check Column -->
    <section class="ot-column ot-column-check">
      <div class="ot-column-header">
        <div class="ot-column-icon"><i class="fas fa-search"></i></div>
        <span class="ot-column-title">Ready to Check</span>
        <span class="ot-column-count" id="readyToCheckCount">0</span>
      </div>
      <div class="ot-column-body" id="readyToCheckColumn"></div>
    </section>

    <!-- Completed Column -->
    <section class="ot-column ot-column-done">
      <div class="ot-column-header">
        <div class="ot-column-icon"><i class="fas fa-check-double"></i></div>
        <span class="ot-column-title">Completed</span>
        <span class="ot-column-count" id="completedCount">0</span>
      </div>
      <div class="ot-column-body" id="completedColumn"></div>
    </section>
  </div>
</div>

<!-- Order Details Modal -->
<div id="orderDetailsModal" class="modal-backdrop">
  <div class="modal modal-lg">
    <div class="modal-header">
      <div class="modal-header-icon">
        <i class="fas fa-box"></i>
      </div>
      <h2 class="modal-title" id="orderDetailsTitle">Order Details</h2>
      <button class="modal-close" id="closeOrderDetailsBtn">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <div class="modal-body" id="orderDetailsBody">
      <!-- Order details will be inserted here -->
    </div>
    <div class="modal-footer modal-footer-split">
      <div class="modal-footer-left">
        <button class="action-btn danger-btn" id="orderDetailsCancelSessionBtn" style="display: none;">
          <i class="fas fa-times-circle"></i> Cancel Order
        </button>
      </div>
      <div class="modal-footer-right">
        <button class="action-btn warning-btn" id="orderDetailsReleaseBtn" style="display: none;">
          <i class="fas fa-hand-paper"></i> Release
        </button>
        <button class="action-btn secondary-btn" id="cancelOrderDetailsBtn">
          Close
        </button>
        <button class="action-btn primary-btn" id="orderDetailsActionBtn">
          <i class="fas fa-play"></i> Start
        </button>
      </div>
    </div>
  </div>
</div>

<script type="module" src="/js/modules/birmingham-orders/order-tracking.js"></script>
