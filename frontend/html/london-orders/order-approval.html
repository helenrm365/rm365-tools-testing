<!-- London Orders - Order Approval Page -->
<!-- Uses css/app.css + css/pages/orders/approval.css -->
<div class="order-approval">
  <!-- Header -->
  <header class="page-header">
    <div class="header-content">
      <h1 class="page-title">London Orders - Order Approval</h1>
    </div>
    <p class="page-subtitle">Review and approve pending Magento orders for picking at London Office Collection</p>
  </header>

  <!-- Navigation Tabs -->
  <nav class="inner-tabs">
    <button class="tab-button" onclick="location.href='/london-orders/order-fulfillment'">
      <i class="fas fa-shopping-cart"></i>
      <span>Order Fulfillment</span>
    </button>
    <button class="tab-button" onclick="location.href='/london-orders/order-progress'">
      <i class="fas fa-chart-line"></i>
      <span>Order Progress</span>
    </button>
    <button class="tab-button" onclick="location.href='/london-orders/order-tracking'">
      <i class="fas fa-tasks"></i>
      <span>Order Tracking</span>
    </button>
    <button class="tab-button active" onclick="location.href='/london-orders/order-approval'">
      <i class="fas fa-check-circle"></i>
      <span>Order Approval</span>
    </button>
  </nav>

  <!-- Main Content Wrapper -->
  <div class="approval-content">
    
    <!-- Board Controls -->
    <div class="ot-controls" id="approvalBoardSection">
      <div class="ot-live-status" id="liveStatus">
        <span class="ot-dot"></span>
        <span class="status-text">Connecting...</span>
      </div>
      <button class="ot-refresh-btn" id="refreshOrdersBtn">
        <i class="fas fa-sync-alt"></i>
      </button>
      <button class="action-btn success-btn" id="approveAllBtn" style="display: none;">
        <i class="fas fa-check-double"></i>
        <span>Approve All</span>
      </button>
    </div>
    
    <!-- Mobile Column Tabs (only visible in mobile mode) -->
    <div class="mobile-column-tabs" id="mobileColumnTabs" style="display: none;">
      <button class="mobile-tab-button active" data-column="all-orders">
        <i class="fas fa-list-alt"></i>
        <span>All Orders</span>
        <span class="mobile-tab-count" id="mobileAllCount">0</span>
      </button>
      <button class="mobile-tab-button" data-column="pending">
        <i class="fas fa-clock"></i>
        <span>Pending</span>
        <span class="mobile-tab-count" id="mobilePendingCount">0</span>
      </button>
      <button class="mobile-tab-button" data-column="approved-today">
        <i class="fas fa-check-double"></i>
        <span>Approved Today</span>
        <span class="mobile-tab-count" id="mobileApprovedTodayCount">0</span>
      </button>
    </div>
    
    <!-- 3-Column Board -->
    <div class="ot-board" id="approvalBoard">
      <!-- All Orders Column -->
      <section class="ot-column ot-column-all" id="allOrdersSection">
        <div class="ot-column-header">
          <div class="ot-column-icon"><i class="fas fa-list-alt"></i></div>
          <span class="ot-column-title">All Orders</span>
          <span class="ot-column-count" id="allOrdersColumnCount">0</span>
        </div>
        <div class="ot-column-body" id="allOrdersColumn"></div>
      </section>

      <!-- Pending Orders Column -->
      <section class="ot-column ot-column-pending" id="pendingSection">
        <div class="ot-column-header">
          <div class="ot-column-icon"><i class="fas fa-clock"></i></div>
          <span class="ot-column-title">Pending Orders</span>
          <span class="ot-column-count" id="pendingColumnCount">0</span>
        </div>
        <div class="ot-column-body" id="pendingColumn"></div>
      </section>

      <!-- Approved Today Column -->
      <section class="ot-column ot-column-approved" id="approvedTodaySection">
        <div class="ot-column-header">
          <div class="ot-column-icon"><i class="fas fa-check-double"></i></div>
          <span class="ot-column-title">Approved Today</span>
          <span class="ot-column-count" id="approvedTodayColumnCount">0</span>
        </div>
        <div class="ot-column-body" id="approvedTodayColumn"></div>
      </section>
    </div>
  </div>
</div>

<!-- Order Details Modal -->
<div id="orderDetailsModal" class="modal-backdrop">
  <div class="modal modal-lg">
    <div class="modal-header">
      <div class="modal-header-icon">
        <i class="fas fa-box"></i>
      </div>
      <h2 class="modal-title" id="orderDetailsTitle">Order Details</h2>
      <button class="modal-close" id="closeOrderDetailsBtn">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <div class="modal-body" id="orderDetailsBody">
      <!-- Order details will be inserted here -->
    </div>
    <div class="modal-footer modal-footer-split">
      <div class="modal-footer-left"></div>
      <div class="modal-footer-right">
        <button class="action-btn secondary-btn" id="cancelOrderDetailsBtn">
          Close
        </button>
        <button class="action-btn success-btn" id="approveFromModalBtn">
          <i class="fas fa-check"></i> Approve Order
        </button>
      </div>
    </div>
  </div>
</div>

<script type="module" src="/js/modules/london-orders/order-approval.js"></script>
