<!-- Inventory Management Dashboard -->
<!-- Uses css/app.css + css/pages/inventory/management.css -->
<div class="inventory-management inventory-dashboard">
  <!-- Header -->
  <header class="page-header">
    <div class="header-content">
      <h1 class="page-title">Inventory Management</h1>
    </div>
    <p class="page-subtitle">Overview of stock levels across all branches</p>
  </header>

  <!-- Navigation Tabs -->
  <nav class="nui-tabs">
    <button class="nui-tab is-active" onclick="location.href='/inventory/management/dashboard'">
      <i class="fas fa-boxes"></i>
      <span>Management</span>
    </button>
    <button class="nui-tab" onclick="location.href='/inventory/sourcing'">
      <i class="fas fa-truck-loading"></i>
      <span>Product Sourcing</span>
    </button>
  </nav>

  <!-- Branch Tabs (Sub-navigation for Management) -->
  <nav class="nui-tabs">
    <a href="/inventory/management/dashboard" class="nui-tab is-active" data-nav data-branch="dashboard">
      <i class="fas fa-gauge-high"></i>
      <span>Dashboard</span>
    </a>
    <a href="/inventory/management/uk-birmingham" class="nui-tab" data-nav data-branch="uk-birmingham">
      <i class="fas fa-warehouse"></i>
      <span>UK Birmingham</span>
    </a>
    <a href="/inventory/management/uk-london" class="nui-tab" data-nav data-branch="uk-london">
      <i class="fas fa-warehouse"></i>
      <span>UK London</span>
    </a>
    <a href="/inventory/management/fr-paris" class="nui-tab" data-nav data-branch="fr-paris">
      <i class="fas fa-warehouse"></i>
      <span>FR Paris</span>
    </a>
  </nav>

  <!-- Dashboard Content -->
  <div class="management-content">
    <div class="inventory-dashboard-grid">
      <!-- Low Stock Card -->
      <div class="card inventory-stat-card stat-low">
        <div class="stat-icon">
          <i class="fas fa-arrow-trend-down"></i>
        </div>
        <div class="stat-info">
          <span class="stat-value" id="lowStockCount">--</span>
          <span class="stat-label">Low Stock Products</span>
        </div>
      </div>

      <!-- Over Stock Card -->
      <div class="card inventory-stat-card stat-over">
        <div class="stat-icon">
          <i class="fas fa-arrow-trend-up"></i>
        </div>
        <div class="stat-info">
          <span class="stat-value" id="overStockCount">--</span>
          <span class="stat-label">Over Stock Products</span>
        </div>
      </div>

      <!-- Stable Stock Card -->
      <div class="card inventory-stat-card stat-stable">
        <div class="stat-icon">
          <i class="fas fa-check-circle"></i>
        </div>
        <div class="stat-info">
          <span class="stat-value" id="stableStockCount">--</span>
          <span class="stat-label">Stable Products</span>
        </div>
      </div>
    </div>

    <!-- Scanner Activity Line Chart -->
    <div class="dashboard-chart-section">
      <div class="chart-container">
        <h4>Scanner Activity</h4>

        <!-- Controls Row -->
        <div class="chart-controls">
          <!-- Reason Toggle Buttons -->
          <div class="btn-group" id="reasonToggles">
            <button class="btn btn-faded btn-success active" data-reason="Order">
              <i class="fas fa-box-open"></i> Products Out
            </button>
            <button class="btn btn-faded btn-success active" data-reason="Return">
              <i class="fas fa-rotate-left"></i> Returns
            </button>
            <button class="btn btn-faded btn-success active" data-reason="Stock Re-evaluation">
              <i class="fas fa-clipboard-check"></i> Re-evaluated
            </button>
          </div>

          <!-- Branch Toggle Buttons -->
          <div class="btn-group" id="branchToggles">
            <button class="btn btn-faded btn-success active" data-branch="uk-birmingham">
              <i class="fas fa-warehouse"></i> Birmingham
            </button>
            <button class="btn btn-faded btn-success active" data-branch="uk-london">
              <i class="fas fa-warehouse"></i> London
            </button>
            <button class="btn btn-faded btn-success active" data-branch="fr-paris">
              <i class="fas fa-warehouse"></i> Paris
            </button>
          </div>

          <!-- Date Range Pickers -->
          <div class="chart-date-range">
            <div class="nui-field">
              <label class="nui-label" for="chartDateFrom">From</label>
              <input type="text" id="chartDateFrom" class="nui-input nui-input-default" placeholder="YYYY-MM-DD">
            </div>
            <div class="nui-field">
              <label class="nui-label" for="chartDateTo">To</label>
              <input type="text" id="chartDateTo" class="nui-input nui-input-default" placeholder="YYYY-MM-DD">
            </div>
          </div>
        </div>

        <!-- Chart Canvas -->
        <div class="chart-wrapper">
          <canvas id="scannerActivityChart"></canvas>
        </div>
      </div>
    </div>
  </div>
</div>
