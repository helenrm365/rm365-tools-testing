<!-- Product Sourcing Page -->
<!-- Uses css/app.css + css/pages/inventory/sourcing.css -->
<div class="product-sourcing">
  <!-- Header -->
  <header class="page-header">
    <div class="header-content">
      <h1 class="page-title">Product Sourcing</h1>
    </div>
    <p class="page-subtitle">Manage supplier pricing, compare costs, and track margins across all products</p>
  </header>

  <!-- Navigation Tabs -->
  <nav class="inner-tabs">
    <button class="tab-button" onclick="location.href='/inventory/management'">
      <i class="fas fa-boxes"></i>
      <span>Management</span>
    </button>
    <button class="tab-button active" onclick="location.href='/inventory/sourcing'">
      <i class="fas fa-truck-loading"></i>
      <span>Product Sourcing</span>
    </button>
  </nav>

  <!-- Main Content -->
  <div class="sourcing-content">
    
    <!-- ===== Sub-Navigation Tabs ===== -->
    <div class="sourcing-sub-tabs">
      <button class="sub-tab-button active" data-tab="dashboard">
        <i class="fas fa-chart-pie"></i>
        <span>Dashboard</span>
      </button>
    </div>

    <!-- ===== Tab Content Panels ===== -->
    
    <!-- Dashboard Panel -->
    <div class="sourcing-tab-panel active" id="panel-dashboard">
      <div class="panel-header">
        <h2><i class="fas fa-chart-pie"></i> Sourcing Dashboard</h2>
      </div>
      <div class="panel-body">
        <div class="coming-soon-placeholder" style="text-align: center; padding: 4rem 2rem;">
          <i class="fas fa-hard-hat" style="font-size: 4rem; color: var(--warning); margin-bottom: 1rem;"></i>
          <h3 style="margin-bottom: 0.5rem;">Product Sourcing - Coming Soon</h3>
          <p style="color: var(--text-2); max-width: 500px; margin: 0 auto;">
            This module is currently being rebuilt. Supplier pricing, product mappings, and margin analysis features will be available soon.
          </p>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- Universal Footer -->
<div id="footerPlaceholder"></div>
<script>
  if (!document.getElementById('universalFooter')) {
    fetch('/components/universal-footer.html')
      .then(response => response.text())
      .then(html => {
        document.getElementById('footerPlaceholder').innerHTML = html;
      })
      .catch(error => console.error('Error loading footer:', error));
  }
</script>
