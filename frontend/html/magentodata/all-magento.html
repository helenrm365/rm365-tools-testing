<!-- All Sales Data Page (Combined Regions) -->
<!-- Uses css/app.css + css/pages/magentodata/universal.css + css/pages/magentodata/filters-modal.css -->
<div class="magentodata-page">
  <!-- Header -->
  <header class="page-header">
    <div class="header-content">
      <h1 class="page-title">All Regions</h1>
    </div>
    <p class="page-subtitle">Combined view of UK, FR, and NL sales data</p>
  </header>

  <!-- Navigation Tabs -->
  <nav class="nui-tabs">
    <button class="nui-tab is-active" onclick="location.href='/sales/all'">
      <i class="fas fa-globe"></i>
      <span>All</span>
    </button>
    <button class="nui-tab" onclick="location.href='/sales/uk'">
      <i class="fas fa-flag"></i>
      <span>UK</span>
    </button>
    <button class="nui-tab" onclick="location.href='/sales/fr'">
      <i class="fas fa-flag"></i>
      <span>FR</span>
    </button>
    <button class="nui-tab" onclick="location.href='/sales/nl'">
      <i class="fas fa-flag"></i>
      <span>NL</span>
    </button>
    <button class="nui-tab" onclick="location.href='/sales/history'">
      <i class="fas fa-history"></i>
      <span>History</span>
    </button>
  </nav>

  <!-- Main Content -->
  <div class="magento-content">
    <!-- Full Data Table Section (shown in full view mode) -->
    <div class="action-block" id="fullDataBlock">
      <div class="block-header">
        <div class="block-icon">
          <i class="fas fa-table"></i>
        </div>
        <div class="block-title-group">
          <h3 class="block-title" id="orderDataTitle">Order Data</h3>
          <p class="block-subtitle">All regions combined orders and products</p>
        </div>
        <div class="block-header-actions">
          <input type="text" id="magentoSearchInput" class="nui-input nui-input-default" 
                   placeholder="Search by order number or SKU..."
                   autocomplete="off"
                   data-form-type="other"
                   data-lpignore="true">
          <button class="btn btn-solid btn-default rounded-lg" id="clearSearchBtn">
            <i class="fas fa-times"></i>
            <span>Clear</span>
          </button>
        </div>
      </div>
      <div class="block-content">
        <div class="controls-grid">
          <!-- View Toggle -->
          <div class="btn-group view-toggle">
            <button class="btn btn-faded btn-success active" id="viewFullBtn">
              <i class="fas fa-list"></i>
              <span>Full Data</span>
            </button>
            <button class="btn btn-faded btn-success" id="viewAggregatedBtn">
              <i class="fas fa-calendar-alt"></i>
              <span>6-Month</span>
            </button>
            <button class="btn btn-faded btn-success" id="customRangeBtn">
              <i class="fas fa-calendar-day"></i>
              <span>Custom Range</span>
            </button>
          </div>

          <!-- Action Buttons -->
          <div class="action-buttons-row">
            <button class="btn btn-solid btn-default rounded-lg" id="exportPdfBtn" title="Export to PDF" style="display: none;">
              <i class="fas fa-file-pdf"></i>
              <span>Export PDF</span>
            </button>
            <button class="btn btn-solid btn-default rounded-lg" id="exportCsvBtn" title="Export to CSV" style="display: none;">
              <i class="fas fa-file-csv"></i>
              <span>Export CSV</span>
            </button>
          </div>
        </div>
        <div class="table-container">
          <table class="products-table" id="magentoTable">
            <thead class="table-header">
              <tr>
                <th><i class="fas fa-globe"></i> Region</th>
                <th><i class="fas fa-hashtag"></i> Order Number</th>
                <th><i class="fas fa-calendar"></i> Created At</th>
                <th><i class="fas fa-barcode"></i> Product SKU</th>
                <th><i class="fas fa-box"></i> Product Name</th>
                <th><i class="fas fa-sort-numeric-up"></i> Qty</th>
                <th><i class="fas fa-pound-sign"></i> Price</th>
                <th><i class="fas fa-info-circle"></i> Status</th>
                <th><i class="fas fa-money-bill"></i> Currency</th>
                <th><i class="fas fa-calculator"></i> Grand Total</th>
                <th><i class="fas fa-envelope"></i> Email</th>
                <th><i class="fas fa-user"></i> Customer</th>
                <th><i class="fas fa-map-marker-alt"></i> Billing</th>
                <th><i class="fas fa-shipping-fast"></i> Shipping</th>
                <th><i class="fas fa-users"></i> Group</th>
              </tr>
            </thead>
            <tbody id="magentoTableBody" class="table-body">
              <tr>
                <td colspan="15">
                  <div class="table-loading">
                    <div class="loading-spinner"></div>
                    <span>Loading data...</span>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Aggregated Data Section (shown in 6-month and custom range modes) -->
    <div id="aggregatedDataBlock" style="display: none;"></div>

    <!-- Pagination Section (for full data view only) -->
    <section class="table-pagination" id="paginationSection">
      <div class="pagination-wrapper">
        <div class="pagination-info" id="paginationInfo">
          Showing <strong>0</strong> of <strong>0</strong> items
        </div>
        <div class="pagination-controls">
          <button id="prevPageBtn" class="btn btn-ghost btn-success" disabled>
            <i class="fas fa-chevron-left"></i>
            <span>Previous</span>
          </button>
          <span id="pageInfo" class="page-indicator">Page 1 of 1</span>
          <button id="nextPageBtn" class="btn btn-ghost btn-success" disabled>
            <span>Next</span>
            <i class="fas fa-chevron-right"></i>
          </button>
        </div>
      </div>
    </section>
  </div>
</div>
